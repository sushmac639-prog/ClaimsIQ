services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claimiq}
      POSTGRES_USER: ${POSTGRES_USER:-claimiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claimiq} -d ${POSTGRES_DB:-claimiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-claimiq}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}@db:5432/${POSTGRES_DB:-claimiq}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
      - claimiq_documents:/app/data/documents
      - claimiq_chroma:/app/data/chroma

volumes:
  postgres_data:
  claimiq_documents:
  claimiq_chroma:
