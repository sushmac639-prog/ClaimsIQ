apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: claimiq-data
  labels:
    app: claimiq-api

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: claimiq-documents
  labels:
    app: claimiq-api

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 50Gi
