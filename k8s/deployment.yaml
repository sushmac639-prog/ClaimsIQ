apiVersion: apps/v1
kind: Deployment

metadata:
  name: claimiq-api
  labels:
    app: claimiq-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: claimiq-api

  template:
    metadata:
      labels:
        app: claimiq-api

    spec:
      containers:
        - name: claimiq-api

          # CD pipeline replaces this image after applying the manifest.
          image: REPLACE_ACR_LOGIN_SERVER/claimiq-api:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: claimiq-config

            - secretRef:
                name: claimiq-secrets

          command:
            - sh
            - -c

          args:
            - >
              alembic upgrade head &&
              exec uvicorn app.main:app
              --host 0.0.0.0
              --port 8000

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http

            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http

            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1000m"
              memory: "2Gi"

          volumeMounts:
            - name: chroma-data
              mountPath: /app/data/chroma

            - name: documents
              mountPath: /app/data/documents

      volumes:
        - name: chroma-data
          persistentVolumeClaim:
            claimName: claimiq-data

        - name: documents
          persistentVolumeClaim:
            claimName: claimiq-documents