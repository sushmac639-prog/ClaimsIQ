name: ClaimIQ Deploy to AKS

on:
  workflow_run:
    workflows:
      - "ClaimIQ CI"
    types:
      - completed

  workflow_dispatch:

env:
  IMAGE_NAME: claimiq-api

jobs:
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    permissions:
      contents: read

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "${{ secrets.ACR_NAME }}"

      - name: Set image tag
        id: image
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        env:
          REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker build \
            -t "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" \
            .

          docker push \
            "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Create or update application secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          kubectl create secret generic claimiq-secrets \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            --from-literal=AZURE_OPENAI_API_KEY="$AZURE_OPENAI_API_KEY" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/

      - name: Update AKS image
        env:
          REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          kubectl set image deployment/claimiq-api \
            claimiq-api="$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

      - name: Verify AKS rollout
        run: |
          kubectl rollout status deployment/claimiq-api \
            --timeout=180s