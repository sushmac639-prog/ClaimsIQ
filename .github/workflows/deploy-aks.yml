name: ClaimIQ Deploy to AKS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: claimiq-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ secrets.ACR_NAME }}"

      - name: Build and push image
        env:
          REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          docker build -t "$REGISTRY/$IMAGE_NAME:${GITHUB_SHA}" .
          docker push "$REGISTRY/$IMAGE_NAME:${GITHUB_SHA}"

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Create/update application secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          kubectl create secret generic claimiq-secrets \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            --from-literal=AZURE_OPENAI_API_KEY="$AZURE_OPENAI_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Update image
        run: |
          kubectl set image deployment/claimiq-api \
            claimiq-api="${{ secrets.ACR_LOGIN_SERVER }}/$IMAGE_NAME:${GITHUB_SHA}"
          kubectl rollout status deployment/claimiq-api --timeout=180s
